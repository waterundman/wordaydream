# Wordaydream Netlify CI workflow (原 Netlify Deploy CI)
#
# v2.4.0 重构 (2026-09 CI 审计):
# - 删除 deploy job: 历史上因 ci job 失败 (needs: ci) 从未执行过;
#   生产部署由 Netlify 官方 Git 集成 (netlify.toml) 负责, 两者是冗余双路径.
#   保留此 workflow 仅作 CI 检查 (lint + test + typecheck + build + PWA manifest verify).
# - 加 concurrency: 同 ref 新 push 取消旧 run.
# - 删除硬编码 VITE_APP_VERSION '1.5.1' 的 deploy build (job 已删).
#
# 历史 (v1.5.0/v1.5.1): 本 workflow 曾承担 GitHub Actions 直接 deploy, 需要以下 secrets:
#   NETLIFY_AUTH_TOKEN / NETLIFY_SITE_ID / VITE_LLM_PROXY_URL 等.
#   Netlify 官方集成的环境变量在 Netlify UI (Site settings -> Environment variables) 配置.
#
# 完整 runbook 见 docs/OPERATIONS.md
#   - Section 1: Netlify 部署 (8 步骤)
#   - Section 2: 3 API key 配置 (15 步骤)
#
# 0 emoji (硬约束)

name: Netlify CI

# v2.4.0 fix: 同 ref 新 push 取消旧 run, 避免排队浪费 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI (lint + test + typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        # v1.5.2 fix M14: lint 改为 required, 失败即阻塞 CI (移除 || echo 容错)
        run: npm run lint

      - name: Check version alignment
        # v0.5.0-harmony Stage 1: 单一版本真源校验, 在测试前阻止版本口径漂移
        run: npm run check:versions

      - name: Test
        run: npm run test:run

      - name: TypeScript check
        run: npx tsc -b

      - name: Build
        run: npm run build
        env:
          VITE_LLM_PROVIDER: mock
          VITE_LLM_PROXY_URL: ${{ secrets.VITE_LLM_PROXY_URL }}
          VITE_LLM_GRAYSCALE: '0'

      - name: Verify PWA manifest + SW
        run: |
          test -f dist/manifest.webmanifest && echo "manifest OK"
          test -f dist/sw.js && echo "sw.js OK"
