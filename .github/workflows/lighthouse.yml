# Wordaydream v1.5.1 Stage 1 P0_3: Lighthouse CI workflow
#
# 4 阻塞点 runbook 之一 (阻塞点 3: Lighthouse 5 项真实跑分)
#   docs/OPERATIONS.md Section 3 包含 5 步骤 runbook.
#
# 真实跑分由 GitHub Actions runner 执行, 沙箱不执行 (无 Lighthouse CLI + Chrome).
# 用户需在 GitHub repo Settings -> Secrets 配置:
#   LHCI_GITHUB_APP_TOKEN (Lighthouse CI GitHub App 自动创建, 用于 PR 评论)
#   LIGHTHOUSE_TARGET_URL (Netlify site URL, 手动设置, 默认 https://wordaydream.netlify.app)
#
# v1.5.1 强化:
# - 5% buffer: assertScore 阈值比 lighthouse.config.js 5 项低 5%, 减少 CI 波动误报
# - retry 3: lhci autorun 默认 1 次, 强化 3 次取中位数
# - 触发: 每周 cron (持续监控) + workflow_dispatch (手动)
# - 上传: artifacts 30 天, 可在 PR 评论中查看
#
# 0 emoji (硬约束)

name: Lighthouse CI

# v2.4.0 fix: 同 ref 新 push 取消旧 run, 避免排队浪费 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  # PR 触发 (可选, 默认关闭, 避免每次 PR 都跑 3 次 lighthouse)
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  # 每周一 06:00 UTC cron (持续监控, 跑 production URL)
  schedule:
    - cron: '0 6 * * 1'
  # 手动触发
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Lighthouse target URL (Netlify production)'
        required: false
        default: 'https://wordaydream.netlify.app'

jobs:
  lighthouse:
    name: Lighthouse 5 项评级 (PWA / Performance / A11y / BP / SEO)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Read app version from package.json
        id: appver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build (mock provider, 避免真实 API key 触发)
        run: npm run build
        env:
          VITE_LLM_PROVIDER: mock
          VITE_LLM_PROXY_URL: 'http://localhost:8888/.netlify/edge-functions/llm-proxy'
          VITE_LLM_GRAYSCALE: '0'
          VITE_OFFLINE_FALLBACK: 'true'
          # v2.4.0 fix: 从 package.json 动态读取, 替换硬编码 '1.5.1' (与实际版本脱节)
          VITE_APP_VERSION: ${{ steps.appver.outputs.version }}

      # v2.4.0 fix: 直接用 @lhci/cli (已在 devDependencies), 不再依赖 treosh/lighthouse-ci-action.
      # 原 action (v11) 2+ 年未更新, 与 Lighthouse 11 兼容性差, 且 configPath 期望 LHCI config
      # 不是 lighthouse config. .lighthouserc.cjs 用 staticDistDir 测试 ./dist 产物, 不依赖外部 URL.
      - name: Run Lighthouse CI (4 项评级, 3 次取中位数, 5% buffer)
        run: npx lhci autorun --config=./.lighthouserc.cjs
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            .lighthouseci/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "Lighthouse CI run completed (see artifacts for full report)"
          echo "4 项评级 (PWA 已在 Lighthouse 10 移除, 仅 performance / a11y / BP / SEO)"
          echo "5% buffer applied, retry 3 (numberOfRuns: 3 in .lighthouserc.cjs)"
