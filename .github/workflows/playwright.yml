# Wordaydream v1.5.1 Stage 1 P0_4: Playwright E2E workflow
#
# 4 阻塞点 runbook 之一 (阻塞点 4: Playwright 4 场景真实 E2E)
#   docs/OPERATIONS.md Section 4 包含 6 步骤 runbook.
#
# 真实跑分由 GitHub Actions runner 执行, 沙箱不执行 (无 Playwright Chromium).
#
# v1.5.1 强化:
# - microsoft/playwright-github-action@v1 (社区主流, 缓存 browser binaries)
# - 4 截图归档: T01-T04 每个场景的 page.screenshot, 存到 debug_shots_v151/
# - 触发: PR + push to main/develop + 每周六 cron
# - 报告: HTML + JSON, 30 天 artifacts
# - browser 缓存: $PLAYWRIGHT_BROWSERS_PATH=0 (避免污染全局)
#
# 0 emoji (硬约束)

name: Playwright E2E

# v2.4.0 fix: 同 ref 新 push 取消旧 run, 避免排队浪费 runner
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]
  # 每周六 06:00 UTC cron (持续监控)
  schedule:
    - cron: '0 6 * * 6'
  workflow_dispatch:

jobs:
  playwright:
    name: Playwright E2E (chromium 基线)
    runs-on: ubuntu-latest
    # v2.4.0 fix: 20min 在 linux runner 上余量不足 (npm ci + browser install +
    # webServer build 300s + 4x4 测试), 撞线超时; 放宽到 35min.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # v2.4.0 fix: 删 microsoft/playwright-github-action@v1 (已废弃, 且其锁定的
      # playwright 版本与 @playwright/test 不匹配, 导致 browser binary 版本冲突).
      # 改用本地 @playwright/test 的 npx playwright install --with-deps, 版本必然一致.
      # v1.6.3 S4: 矩阵收缩为 chromium 基线 (产品目标平台 ArkWeb/Chromium 内核 +
      # 桌面 Chrome), 不再安装 firefox/webkit — 全矩阵为手动 opt-in, 见 playwright.config.ts.
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      # v2.4.0 fix: 删单独 build 步骤.
      # 由 playwright.config.ts webServer 统一 build + preview (带完整 VITE env),
      # 避免 CI 重复 build 导致 20min 超时.
      # v1.6.3 S4: 无 E2E_FULL_MATRIX 时 config 默认集合仅 chromium.
      - name: Run Playwright tests (chromium baseline)
        run: npx playwright test
        env:
          # CI 模式, 启用 retries=1 (在 playwright.config.ts 已判断)
          CI: 'true'

      - name: Upload Playwright Report (HTML + JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Upload 4 截图归档 (T01-T04)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-shots-v151
          path: debug_shots_v151/
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "Playwright E2E run completed (chromium baseline: offline / install / SW / streaming)"
          echo "v1.6.3 S4: 默认仅 chromium; 全矩阵为手动 opt-in (E2E_FULL_MATRIX=true, 见 playwright.config.ts)"
          echo "失败时: trace.zip + video.webm 保留 (见 playwright-report/)"
