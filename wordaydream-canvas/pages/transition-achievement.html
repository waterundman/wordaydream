    <style>
/* ===== Page-specific styles ===== */

/* Base layer: dimmed home context */
.home-context {
  position: absolute;
  inset: 0;
  opacity: 1;
  background: var(--surface-base);
  padding: 40px 56px;
  overflow: hidden;
  font-family: var(--font-sans);
}

.home-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 32px;
}

.home-brand {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 500;
  color: var(--text-50);
  letter-spacing: -0.01em;
}

.home-streak-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 36px;
  padding: 0 14px;
  border-radius: 9999px;
  background: var(--surface-subtle);
  border: 1px solid var(--border-700);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-100);
}

.home-streak-pill svg {
  width: 14px;
  height: 14px;
  color: var(--primary);
}

/* Reading card mock */
.home-card {
  background: var(--surface-elevated);
  border: 1px solid var(--border-700);
  border-radius: 16px;
  padding: 24px 28px;
  max-width: 420px;
  margin-bottom: 24px;
}

.home-card-tag {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-400);
  margin-bottom: 8px;
}

.home-card-title {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 500;
  color: var(--text-50);
  margin: 0 0 4px;
}

.home-card-author {
  font-family: var(--font-serif);
  font-size: 14px;
  color: var(--text-300);
  margin: 0 0 20px;
}

.home-card-progress-track {
  width: 100%;
  height: 4px;
  border-radius: 9999px;
  background: var(--border-600);
  overflow: hidden;
}

.home-card-progress-fill {
  width: 42%;
  height: 100%;
  border-radius: 9999px;
  background: var(--primary);
}

.home-card-progress-text {
  display: block;
  margin-top: 8px;
  font-size: 12px;
  color: var(--text-400);
  font-family: var(--font-mono);
}

/* Stats row */
.home-stats {
  display: flex;
  gap: 32px;
}

.home-stat {
  display: flex;
  flex-direction: column;
}

.home-stat-value {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 500;
  color: var(--text-50);
  line-height: 1;
}

.home-stat-label {
  font-size: 12px;
  color: var(--text-400);
  margin-top: 4px;
}

/* ===== Terracotta overlay ===== */
.terracotta-overlay {
  position: fixed;
  inset: 0;
  background: var(--primary);
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  opacity: 0;
  transform: scale(0.85);
  pointer-events: none;
}

.celebration-content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  max-width: 360px;
  padding: 0 32px;
  text-align: center;
}

.ink-splash {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -60%);
  width: 280px;
  height: auto;
  opacity: 0;
  mix-blend-mode: overlay;
  filter: contrast(1.1) saturate(1.2);
  z-index: 0;
}

.badge-flame {
  position: relative;
  z-index: 1;
  width: 88px;
  height: 88px;
  margin-bottom: 32px;
}

.fleuron {
  position: relative;
  z-index: 1;
  width: 40px;
  height: auto;
  margin: 0 auto 16px;
  display: block;
}

.fleuron circle {
  opacity: 0;
}

.achievement-title {
  position: relative;
  z-index: 1;
  font-family: var(--font-display);
  font-size: 44px;
  color: var(--surface-base);
  font-weight: 400;
  margin: 0 0 8px;
  text-align: center;
  opacity: 0;
  letter-spacing: 0.02em;
}

.achievement-subtitle {
  position: relative;
  z-index: 1;
  font-family: var(--font-sans);
  font-size: 16px;
  color: rgba(250, 249, 245, 0.7);
  text-align: center;
  margin: 0;
  opacity: 0;
  letter-spacing: 0.08em;
}

.grain-overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 2;
  opacity: 0;
}

/* ===== Replay button ===== */
.replay-btn {
  position: fixed;
  bottom: 32px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 30;
  padding: 10px 28px;
  border-radius: 9999px;
  background: var(--surface-base);
  color: var(--text-50);
  font-family: var(--font-sans);
  font-size: 13px;
  border: 1px solid var(--border-700);
  cursor: pointer;
  transition: border-color 200ms ease-out, color 200ms ease-out;
}

.replay-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}

/* ===== Animation: playing state ===== */

/* Home context: dim at 200ms, hold dimmed (overlay stays visible) */
.playing .home-context {
  animation: homeContextSeq 3900ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes homeContextSeq {
  0%      { opacity: 1; }
  5.13%   { opacity: 0.3; }
  100%    { opacity: 0.3; }
}

/* Terracotta overlay: fade+scale in at 200ms, hold visible (no auto-exit) */
.playing .terracotta-overlay {
  animation: overlaySeq 3900ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
  pointer-events: auto;
}
@keyframes overlaySeq {
  0%      { opacity: 0; transform: scale(0.85); }
  5.13%   { opacity: 0; transform: scale(0.85); }
  17.95%  { opacity: 1; transform: scale(1); }
  100%    { opacity: 1; transform: scale(1); }
}

/* Ink splash: fade in at 400ms over 600ms */
.playing .ink-splash {
  animation: inkSplashIn 600ms ease-out 400ms forwards;
}
@keyframes inkSplashIn {
  to { opacity: 0.4; }
}

/* Badge flame: ink-draw at 600ms over 800ms */
.playing .badge-flame path {
  animation: inkDraw 800ms ease-in-out 600ms forwards;
}

/* Fleuron: ink-draw at 900ms over 500ms */
.playing .fleuron path {
  animation: inkDraw 500ms ease-in-out 900ms forwards;
}

/* Fleuron circle: fade in at 900ms over 500ms */
.playing .fleuron circle {
  animation: fadeInElem 500ms ease-out 900ms forwards;
}

@keyframes inkDraw {
  to { stroke-dashoffset: 0; }
}

@keyframes fadeInElem {
  to { opacity: 1; }
}

/* Title: fade in at 1100ms over 400ms */
.playing .achievement-title {
  animation: fadeInElem 400ms ease-out 1100ms forwards;
}

/* Subtitle: fade in at 1300ms over 300ms */
.playing .achievement-subtitle {
  animation: fadeInElem 300ms ease-out 1300ms forwards;
}

/* Grain shimmer: one-shot at 1500ms over 1500ms */
.playing .grain-overlay {
  animation: grainShimmer 1500ms ease-out 1500ms forwards;
}
@keyframes grainShimmer {
  0%   { opacity: 0; }
  50%  { opacity: 0.12; }
  100% { opacity: 0; }
}

/* ===== Reduced motion: instant, final celebration state ===== */
@media (prefers-reduced-motion: reduce) {
  .playing .home-context,
  .playing .terracotta-overlay,
  .playing .ink-splash,
  .playing .badge-flame path,
  .playing .fleuron path,
  .playing .fleuron circle,
  .playing .achievement-title,
  .playing .achievement-subtitle,
  .playing .grain-overlay {
    animation: none !important;
  }

  .playing .home-context { opacity: 0.3; }
  .playing .terracotta-overlay { opacity: 1; transform: scale(1); pointer-events: auto; }
  .playing .ink-splash { opacity: 0.4; }
  .playing .badge-flame path { stroke-dashoffset: 0 !important; }
  .playing .fleuron path { stroke-dashoffset: 0 !important; }
  .playing .fleuron circle { opacity: 1; }
  .playing .achievement-title { opacity: 1; }
  .playing .achievement-subtitle { opacity: 1; }
  .playing .grain-overlay { opacity: 0; }
}
    </style>
</head>
<body class="min-h-screen font-sans antialiased">
    <main>
        <div class="achievement-stage" id="achievementStage">

            <!-- ===== Base layer: dimmed home context ===== -->
            <div class="home-context" aria-hidden="true">

    <script>
(function() {
    'use strict';

    var stage = document.getElementById('achievementStage');
    var replayBtn = document.getElementById('replayBtn');

    var INITIAL_DELAY = 500;
    var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* Set up SVG ink-draw: calculate path lengths and set dash arrays */
    function setupInkDraw(svg) {
        if (!svg) return;
        var paths = svg.querySelectorAll('path');
        for (var i = 0; i < paths.length; i++) {
            try {
                var length = paths[i].getTotalLength();
                if (length > 0) {
                    paths[i].style.strokeDasharray = length;
                    paths[i].style.strokeDashoffset = length;
                }
            } catch (e) {
                /* getTotalLength may fail for non-path elements */
            }
        }
    }

    /* Initialize all ink-draw paths */
    setupInkDraw(document.querySelector('.badge-flame'));
    setupInkDraw(document.querySelector('.fleuron'));

    /* Trigger animation by toggling the playing class */
    function play() {
        stage.classList.remove('playing');
        void stage.offsetWidth; /* force reflow to restart animations */
        stage.classList.add('playing');
    }

    /* Auto-play on load, then hold the celebration visible (no auto-exit) */
    if (prefersReducedMotion) {
        /* Reduced motion: show celebration statically and hold */
        setTimeout(function() {
            stage.classList.add('playing');
        }, INITIAL_DELAY);
    } else {
        setTimeout(function() {
            play();
        }, INITIAL_DELAY);
    }

    /* Replay button: reset all elements to initial state, then play from the beginning */
    replayBtn.addEventListener('click', function() {
        play();
    });
})();
    </script>
